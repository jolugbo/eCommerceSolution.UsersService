services:
  postgres:
    image: postgres:17
    container_name: ecommerce-postgres
    environment:
      POSTGRES_DB: eCommerceUsers
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: '@ssessGranted'
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eCommerceUsers"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: eCommerce.API/Dockerfile
    container_name: ecommerce-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      POSTGRES_HOST: postgres
      POSTGRES_DATABASE: eCommerceUsers
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: '@ssessGranted'
      POSTGRES_PORT: 5432
    ports:
      - "8080:8080"
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
